<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef1f8" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Cash Book — Simple</title>
    <style>
      /* latin-ext -- covers ₹ (U+20B9) among other extended punctuation/currency
         glyphs. The base "latin" subset below does NOT include ₹, so without
         this rule every rupee sign in the app silently falls back to the
         system font, breaking the "Figtree everywhere" look right where a
         mismatch is most visible: bold amount displays. */
      @font-face {
        font-family: "Figtree";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(fonts/figtree-latinext-variable.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Figtree";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(fonts/figtree-latin-variable.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #eef1f8;
        overflow-x: hidden;
        overscroll-behavior: none;
        font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="app.js"></script>
  </body>
</html>
